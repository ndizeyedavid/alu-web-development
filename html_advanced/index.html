<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmileSchool</title>
</head>

<body>
    <header>
        <div id="logo-container">
            <a href="#"><img src="https://html-homework-assets.vercel.app/logo.svg" alt="Logo"></a>
        </div>

        <nav>
            <a href="#">Courses</a>
            <a href="#">Pricing</a>
            <a href="#">Login</a>
        </nav>
    </header>

    <main>
        <h1>Get Schooled</h1>

        <div id="hero-text">
            <span>SMILES</span>
            <span>GRIN</span>
            <span>LAUGH</span>
        </div>

        <button>REGISTER FOR FREE</button>

        <div id="lower-part">
            <h3><span>Learn</span> from the pros</h3>

            <div id="people">

                <div class="person">
                    <img src="https://html-homework-assets.vercel.app/philip.jpg" alt="Person-1" />
                    <h5>Philip Massey</h5>
                    <i>"Smile of the year"</i>
                    <h6>2018-2019</h6>
                </div>

                <div class="person">
                    <img src="https://html-homework-assets.vercel.app/nannie.jpg" alt="Person-2" />
                    <h5>Nannie Lawrence</h5>
                    <i>Best "Little smile"</i>
                    <h6>2017</h6>
                </div>

                <div class="person">
                    <img src="https://html-homework-assets.vercel.app/bruce.jpg" alt="Person-3" />
                    <h5>Bruce Walters</h5>
                    <i>Best "Friend Smile"</i>
                    <h6>Live performance 2019</h6>
                </div>

                <div class="person">
                    <img src="https://html-homework-assets.vercel.app/henry.jpg" alt="Person-4" />
                    <h5>Henry Hughes</h5>
                    <i>"24h smiles" winner</i>
                    <h6>2016-2019</h6>
                </div>

            </div>
        </div>
    </main>
</body>

</html>
